name: Auto assign

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-assign:
    name: Add reviewers
    # Dependabot PRs get a read-only token and cannot request reviewers.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Reads .github/auto_assign.yml from the calling repository.
      - uses: kentaro-m/auto-assign-action@0a2c53d3721e4c5cfcce6afd4014aecc337979f6 # v2.0.2
