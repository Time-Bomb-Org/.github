name: Mise setup validation

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mise-setup-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.17
          install: false
      - run: bash scripts/validate-mise.sh

  wsl:
    name: Setup (WSL Ubuntu, Linux tools)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl git unzip xz-utils ca-certificates
      - name: Validate setup with Linux mise and Linux tools
        shell: wsl-bash {0}
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          unset MISE_DATA_DIR MISE_CONFIG_DIR MISE_STATE_DIR MISE_CACHE_DIR
          mkdir -p "$HOME/time-bomb-setup" "$HOME/mise-download"
          cp -a . "$HOME/time-bomb-setup/"
          cd "$HOME/time-bomb-setup"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL https://github.com/jdx/mise/releases/download/v2026.10.17/mise-v2026.10.17-linux-x64.tar.gz -o "$HOME/mise-download/mise.tar.gz"
          tar -xzf "$HOME/mise-download/mise.tar.gz" -C "$HOME/mise-download"
          export PATH="$HOME/mise-download/mise/bin:$PATH"
          bash scripts/validate-mise.sh
