name: Jira PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:

permissions:
  pull-requests: read

jobs:
  jira-key:
    name: Require Jira key in PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Jira key
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ (^|[^A-Z0-9])([A-Z][A-Z0-9]*-[0-9]+)([^A-Z0-9]|$) ]]; then
            echo "Jira issue key found in PR title."
          else
            echo "::error title=Jira key missing::Add a Jira key to the PR title, e.g. 'feat(core): handle timeout [PROJECT-123]'"
            exit 1
          fi
