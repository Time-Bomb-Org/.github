name: Jira PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:

permissions:
  issues: write
  pull-requests: write

jobs:
  jira-key:
    name: Require Jira key in PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Jira key
        id: validate
        continue-on-error: true
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ (^|[^A-Z0-9])([A-Z][A-Z0-9]*-[0-9]+)([^A-Z0-9]|$) ]]; then
            echo "Jira issue key found in PR title."
          else
            echo "::error title=Jira key missing::Add a Jira key to the PR title, e.g. 'feat(core): handle timeout [PROJECT-123]'"
            exit 1
          fi

      - name: Comment with the required format
        if: ${{ steps.validate.outcome == 'failure' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Le titre de cette PR doit contenir une clé Jira.\n\nFormat attendu : `feat(core): handle timeout [PROJECT-123]`"
            });

      - name: Fail when Jira key is missing
        if: ${{ steps.validate.outcome == 'failure' }}
        run: exit 1
