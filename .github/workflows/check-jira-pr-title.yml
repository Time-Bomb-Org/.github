name: Jira PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:

permissions:
  issues: write
  pull-requests: write

jobs:
  jira-key:
    name: Require Jira key in PR title
    if: ${{ github.event.pull_request }}
    runs-on: ubuntu-latest
    concurrency:
      group: jira-pr-title-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Validate PR title
        id: validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Byte-wise ranges, so [a-z] never matches uppercase letters.
          LC_ALL: C
        run: |
          # Same header rule as .githooks/commit-msg.
          type_pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?(!)?: .+'
          # Title of the PRs opened by GitHub's Revert button.
          revert_pattern='^Revert ".+"'
          key_pattern='(^|[^A-Z0-9])([A-Z][A-Z0-9]*-[0-9]+)([^A-Z0-9]|$)'
          example='feat(core): handle timeout [SCRUM-123]'
          echo "PR title: $PR_TITLE"

          if [[ "$PR_TITLE" =~ $type_pattern ]]; then
            echo "Conventional Commits type found: ${BASH_REMATCH[1]}"
            echo "type=true" >> "$GITHUB_OUTPUT"
          elif [[ "$PR_TITLE" =~ $revert_pattern ]]; then
            echo "GitHub revert title found."
            echo "type=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Type missing::Start the PR title with a lowercase type and an optional scope, e.g. '$example'"
            echo "type=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$PR_TITLE" =~ $key_pattern ]]; then
            echo "Jira issue key found in PR title: ${BASH_REMATCH[2]}"
            echo "key=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Jira key missing::Add a Jira key to the PR title, e.g. '$example'"
            echo "key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create, update or remove the bot comment
        uses: actions/github-script@v7
        env:
          TYPE_OK: ${{ steps.validate.outputs.type }}
          KEY_OK: ${{ steps.validate.outputs.key }}
        with:
          script: |
            const marker = '<!-- jira-pr-title -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );

            const typeOk = process.env.TYPE_OK === 'true';
            const keyOk = process.env.KEY_OK === 'true';

            if (typeOk && keyOk) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }

            const problems = [];
            if (!typeOk) {
              problems.push(
                '- **Type manquant ou mal écrit** : le titre doit commencer par un type en minuscules '
                + '(`feat`, `fix`, `docs`, `style`, `refactor`, `perf`, `test`, `build`, `ci`, `chore` ou `revert`), '
                + 'un scope facultatif entre parenthèses, puis `: ` et la description. '
                + 'Les titres `Revert "…"` créés par le bouton Revert de GitHub sont aussi acceptés.',
              );
            }
            if (!keyOk) {
              problems.push('- **Clé Jira manquante** : ajoute la clé du ticket, par exemple `[SCRUM-123]`.');
            }

            const body = [
              marker,
              'Le titre de cette PR ne respecte pas le format `type(scope): description [CLÉ-JIRA]`.',
              '',
              ...problems,
              '',
              'Exemple : `feat(core): handle timeout [SCRUM-123]`',
              '',
              'Corrige le titre : ce contrôle se relance tout seul et ce commentaire disparaît.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail when the PR title is invalid
        if: steps.validate.outputs.type != 'true' || steps.validate.outputs.key != 'true'
        run: exit 1
